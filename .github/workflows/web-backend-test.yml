name: web-backend-test

on:
  push:
    branches:
      - "feature/**"
    paths:
      - "web/**"
      - "src/**"
  pull_request:
    branches:
      - main
    paths:
      - "web/**"
      - "src/**"

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            web/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r web/backend/requirements.txt

      - name: Run pytest
        run: python -m pytest web/backend -v
